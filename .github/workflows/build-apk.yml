name: Gerar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: gradle --no-daemon assembleRelease

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Kinora-AndroidTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kinora-AndroidTV
          path: Kinora-AndroidTV.apk

      - name: Publicar na aba Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kinora-AndroidTV.apk
